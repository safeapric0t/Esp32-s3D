[env:esp32s3]
platform = espressif32
board = esp32s3_n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for USB Host CDC, PSRAM, LittleFS
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CONFIG_USB_HOST_CDC_ACM=1
    -D CONFIG_USB_HOST_HW_BUFFER_BIAS=2
    -D CONFIG_SPIRAM=1
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1
    -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
    -D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=1

; Partition table with LittleFS storage
board_build.partitions = partitions.csv

; Upload settings
upload_protocol = esptool
upload_speed = 460800

; Library dependencies (PlatformIO registry)
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    me-no-dev/ESPAsyncWebServer@^3.6.0
    me-no-dev/AsyncTCP@^1.1.1

; Custom SDK config
board_build.embed_txtfiles = 
    sdkconfig.defaults